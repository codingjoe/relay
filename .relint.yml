- name: Import generic views via the "generic" module
  pattern: from django\.views\.generic
  hint: 'Use `from django.views import generic` and reference `generic.View`, `generic.CreateView`, etc. to clearly identify generic views.'
  filePattern: .*\.py
- name: Do not override "template_name" on object-based generic views
  pattern: 'class \w+\([^)]*(?:DetailView|ListView|CreateView|UpdateView|DeleteView)[^)]*\):\n(?:[ \t]+[^\n]*\n)*?[ \t]+template_name\s*='
  hint: 'Object-based generic views have default template names like `<app_label>/<model_name>_detail.html`. Do not override "template_name".'
  filePattern: .*\.py
- name: No private functions (single underscore prefix)
  pattern: 'def _[a-zA-Z]'
  hint: 'Do not use private functions (underscore prefix). This project is not for redistribution.'
  filePattern: '(?!.*(?:/tests/|/test_|conftest\.py$)).*\.py$'
- name: Use "..." instead of "pass" in empty classes
  pattern: 'class \w+[^\n:]*:\n[ \t]+pass\b'
  hint: 'Use `...` instead of `pass` in empty classes.'
  filePattern: .*\.py
- name: No module docstrings on common Django files
  pattern: "^[\"']{3}"
  hint: 'Do not write module docstrings for common Django/Python files. The file name is self-documenting.'
  filePattern: '.*/(models|admin|views|urls|apps|tasks|signals|tests)\.py$'
- name: No RST double backticks in docstrings
  pattern: '``[^`\n]+``'
  hint: 'Use single backticks for inline code, not double backticks. Double backticks are RST syntax, not Markdown.'
  filePattern: .*\.py
- name: "No bare early returns. Use EAFP instead"
  pattern: '\n[ \t]+(?:if|except)\b[^\n]*:\n[ \t]+(?:return\s*\n|continue\b)'
  hint: 'Avoid bare `return` (no value) and `continue` to cut program flow (`if/except ...: return/continue`). Use EAFP (try/except) or match/case instead. Returns with an explicit value are OK.'
  filePattern: .*\.py
- name: Querysets must set an explicit fetch_mode
  pattern: 'def get_queryset\(self\):\n[ \t]+return [^\n]*\.objects\.(?:filter|all|exclude)\((?:(?!\.fetch_mode)[^\n])*\)(?=\s*$)'
  hint: 'Set an explicit `fetch_mode` on every queryset returned from `get_queryset()`, e.g. `.fetch_mode(models.FETCH_PEERS)`, to guard against N+1 query bloat.'
  filePattern: .*\.py
- name: Use .get() instead of .first()
  pattern: '(?i)\.first\(\)(?!.*#\s*noqa)'
  hint: 'Prefer `.get()` with proper exception handling over `.first()` and a None test. If `.first()` is intentional, add `# noqa` to the line.'
  filePattern: .*\.py
- name: Use translate instead of trans
  pattern: '\{%\s*trans\b'
  hint: |
    Use {% translate %} instead of the shorthand {% trans %}.
  filePattern: .*\.html$
- name: Use blocktranslate instead of blocktrans
  pattern: '\{%\s*(end)?blocktrans\b'
  hint: |
    Use {% blocktranslate %} / {% endblocktranslate %} instead of
    the shorthand {% blocktrans %} / {% endblocktrans %}.
  filePattern: .*\.html$
- name: blocktranslate must use trimmed
  pattern: '\{%\s*blocktranslate\b(?![^%]*\btrimmed\b)'
  hint: |
    Always pass `trimmed` to {% blocktranslate %} to strip whitespace
    around interpolation blocks.
  filePattern: .*\.html$
- name: blocktranslate content must start on a new line
  pattern: '\{%\s*blocktranslate\b[^%]*%\}[ \t]*\S'
  hint: |
    Start blocktranslate content on a new line after the opening tag.
    Since `trimmed` strips whitespace, this improves readability without
    affecting output.
  filePattern: .*\.html$
- name: blocktranslate content must start with a capital letter
  pattern: '\{%\s*blocktranslate\b[^%]*%\}\n[ \t]*[a-z]'
  hint: |
    Start blocktranslate content with a capital letter (sentence case).
    Interpolations ({{ }}) and HTML tags are exempt.
  filePattern: .*\.html$
- name: blocktranslate content must end with punctuation
  pattern: '(?m)^(?!.*\{%\s*plural\b)[^\n]*[a-z0-9][ \t]*\n[ \t]*\{%\s*endblocktranslate\b'
  hint: |
    End blocktranslate content with sentence-ending punctuation (.!?).
    Pluralization blocks ({% plural %}) are exempt.
  filePattern: .*\.html$
- name: No em dashes or en dashes
  pattern: '[\u2014\u2013]'
  hint: |
    Do not use em dashes (U+2014) or en dashes (U+2013). Use periods,
    colons, semicolons, or commas for sentence structure. Use hyphens
    (U+002D) for compound words and ranges.
  filePattern: '.*\.(py|html|md|yml|yaml)$'
- name: Use pytest-django settings fixture
  pattern: '\boverride_settings\b'
  hint: 'Use pytest-django''s `settings` fixture instead of Django''s `override_settings` decorator or context manager.'
  filePattern: '(^|.*/)(?:tests(?:/.*|\.py)|test_[^/]*\.py|conftest\.py)$'
- name: Use exc_info=True for exception logging
  pattern: 'logger\.(warning|error|exception)\(f["''].*\{(?:e|error|exc|err)\}'
  hint: 'Use exc_info=True instead of interpolating exception objects in f-strings. Provide a meaningful message without the exception.'
  filePattern: .*\.py
- name: Use %r for logging objects
  pattern: 'logger\.\w+\([^,)]*%s[^,)]*,\s+\w+\s*[,)]'
  hint: 'Use %r instead of %s for logging objects. %r calls repr() which gives better debugging output (type, quotes, structure). Use %s only for string values or attribute accesses (e.g. obj.name).'
  filePattern: .*\.py
- name: No "relay" brand mentions in how-to docs
  pattern: '(?i)\brelay\b'
  hint: |
    How-to docs are brand-agnostic. Do not mention "relay" (the brand).
    Write about the email topic generically instead.
  filePattern: 'know_how/docs/.*\.md$'
- name: Create models with raw_body in one objects.create() call
  pattern: '\.\w*raw_body(?:\s*=|\.save\()'
  hint: |
    Pass `raw_body=SimpleUploadedFile(...)` directly to `objects.create()`
    instead of constructing the instance, assigning the file, and saving
    it in multiple steps.
  filePattern: '(?!.*(?:/tests/|/test_|conftest\.py$)).*\.py$'
- name: No indented imports
  pattern: '\n[ \t]+(?:from[ \t]+\S+[ \t]+import[ \t]|import[ \t]+[\w.]+)'
  hint: |
    Move all imports to the top of the file. To pick up changed settings,
    reload the module with `importlib.reload` instead of importing
    inside a function.
  filePattern: '(?!.*(?:/tasks\.py$|/apps\.py$|/settings\.py$|manage\.py$)).*\.py$'
- name: Compose "!reset" and "!override" tags must carry an explicit value
  pattern: '\n(?P<i>[ \t]*)[^\n:]+:[ \t]*!(?:reset|override)[ \t]*(?=\n(?!(?P=i)[ \t]+\S))'
  hint: 'Bare `!reset` or `!override` tags parse as empty strings outside Docker Compose and fail dclint''s schema validation. Provide a value the parser can resolve, e.g. `!reset null`, `!reset []`, `!reset {}`, or a block collection for `!override`. Docker Compose ignores the value.'
  filePattern: '.*(?:docker-)?compose.*\.ya?ml$'
- name: No code references in user docs
  pattern: '(?i)\bRELAY_[A-Z_]+\b'
  hint: 'docs/docs pages are for relay users, not developers. Replace environment variable and setting names with product wording (the platform domain, the submission host, the dashboard). Internal names live in README.md.'
  filePattern: '^docs/docs/.*\.md$'
- name: Unfiltered sentence msgids start with a capital letter
  pattern: '\{%\s*translate\s+["''][a-z][^"'']*[.!?]["''][^|]*?%\}'
  hint: 'A msgid that renders without `|capfirst` or `|title` is a sentence. Start it with a capital letter. Filtered labels keep their lowercase msgid.'
  filePattern: '.*\.html$'
- name: Sentences after the first in translation strings start with a capital letter
  pattern: '\{%\s*blocktranslate\b[^%]*?%\}[^%]*?[.!?] [a-z]|\{%\s*plural\s*%\}[^%]*?[.!?] [a-z]|\{%\s*translate\s+(["''])(?:(?!\1)[^\n])*?[.!?] [a-z]'
  hint: 'No filter reaches sentences after the first. Start every sentence inside a msgid with a capital letter, including inside blocktranslate and plural blocks.'
  filePattern: '.*\.html$'
- name: Use footnote-style RFC links
  pattern: '\[[^\]\n]*RFC[ ]?\d{3,4}[^\]\n]*\]\(https?://[^)]+\)'
  hint: 'Put the RFC link definition at the bottom of the page and reference it inline, for example `[RFC 8617][rfc-8617]` defined by `[rfc-8617]: https://www.rfc-editor.org/info/rfc8617/`.'
  filePattern: '^docs/docs/.*\.md$|^know_how/docs/.*\.md$'
