<!--
  Source for apple-touch-icon.png (180x180 home-screen icon).

  Full-bleed: iOS masks its own squircle, so the tile ships without
  corner rounding. Same mark and gradient as favicon.svg; re-render the
  PNG at exactly 180x180 after edits.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="relay-gradient-apple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="hsl(292, 90%, 55%)" />
      <stop offset="1" stop-color="hsl(262, 85%, 38%)" />
    </linearGradient>
    <filter id="relay-glyph-shadow-apple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="0.35"
        stdDeviation="0.4"
        flood-color="hsl(268, 100%, 15%)"
        flood-opacity="0.45"
      />
    </filter>
  </defs>
  <rect width="24" height="24" fill="url(#relay-gradient-apple)" />
  <g
    fill="none"
    stroke="#fff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#relay-glyph-shadow-apple)"
  >
    <path d="M20 10H4l5.5 -6" />
    <path d="M4 14h16l-5.5 6" />
  </g>
</svg>
