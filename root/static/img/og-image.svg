<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Relay</title>
  <desc>Social share card with the Relay wordmark and tagline on a purple gradient.</desc>
  <defs>
    <linearGradient id="relay-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d313ec" />
      <stop offset="1" stop-color="#4610a2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#relay-gradient)" />
  <g text-anchor="middle" font-family="Geist Sans, ui-sans-serif, system-ui, sans-serif">
    <text x="600" y="380" font-size="170" font-weight="bold" fill="#fff">relay</text>
    <text x="600" y="403" font-size="42" fill="#fff" fill-opacity="0.85">communication as a service</text>
  </g>
</svg>
