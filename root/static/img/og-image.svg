<!--
  Source for og-image.png (1200x630 social share card).

  Edit this file when the wordmark, tagline, or brand gradient change,
  then re-render the PNG at exactly 1200x630. The PNG is the canonical
  asset served in meta tags; the font stack falls back to system-ui
  wherever Geist Sans is not installed, so render on a machine with the
  brand font (or load it first) for a pixel-faithful result.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="relay-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="hsl(293, 85%, 50%)" />
      <stop offset="1" stop-color="hsl(262, 82%, 35%)" />
    </linearGradient>
    <pattern id="dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="hsl(0, 0%, 100%, 0.12)" />
    </pattern>
    <filter id="wordmark-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="12"
        flood-color="hsl(268, 100%, 15%)"
        flood-opacity="0.35"
      />
    </filter>
    <filter id="tagline-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="6"
        flood-color="hsl(268, 100%, 15%)"
        flood-opacity="0.3"
      />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#relay-gradient)" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <g text-anchor="middle" font-family="Geist Sans, ui-sans-serif, system-ui, sans-serif">
    <text
      x="600"
      y="316"
      font-size="170"
      font-weight="700"
      fill="#fff"
      dominant-baseline="central"
      filter="url(#wordmark-shadow)"
    >relay</text>
    <text
      x="600"
      y="388"
      font-size="42"
      font-weight="500"
      fill="hsl(0, 0%, 100%, 0.85)"
      dominant-baseline="central"
      filter="url(#tagline-shadow)"
    >communication as a service</text>
  </g>
</svg>
