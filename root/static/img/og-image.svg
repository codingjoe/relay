<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Relay</title>
  <desc>Social share card with the Relay wordmark and tagline on a purple gradient.</desc>
  <defs>
    <linearGradient id="relay-gradient" x1="0.66" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C225F5" />
      <stop offset="1" stop-color="#1E448A" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#relay-gradient)" />
  <g text-anchor="middle">
    <text
      x="600"
      y="345"
      font-family="'Space Mono', monospace"
      font-size="170"
      font-style="italic"
      font-weight="bold"
      fill="#fff"
    >relay</text>
    <text
      x="600"
      y="455"
      font-family="'Fira Sans SemiBold', 'Fira Sans', ui-sans-serif, system-ui, sans-serif"
      font-size="52"
      font-weight="600"
      fill="#fff"
    >communication as a service</text>
  </g>
</svg>
