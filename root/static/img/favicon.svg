<?xml version="1.0" encoding="UTF-8"?>
<!--
  Relay logo in SVG Tiny PS (BIMI-compatible, RFC draft-svg-tiny-ps).
  Filters, hsl() colors, and non-SVG-Tiny-1.2 syntax are not allowed in
  that profile: colors are hex, and the drop shadow was flattened away.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 24 24">
  <title>Relay</title>
  <desc>Relay logo, rounded tile with purple gradient and white chevrons.</desc>
  <defs>
    <linearGradient id="relay-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d825f4" />
      <stop offset="1" stop-color="#4b0fb3" />
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5" fill="url(#relay-gradient)" />
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10H4l5.5 -6" />
    <path d="M4 14h16l-5.5 6" />
  </g>
</svg>
