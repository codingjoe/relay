<div
  id="{{ widget.attrs.id }}"
  class="select w-full"
  data-placeholder="{{ widget.attrs.placeholder|default:'Select...' }}"
>
  <button
    type="button"
    id="{{ widget.attrs.id }}-trigger"
    aria-haspopup="listbox"
    aria-expanded="false"
    aria-controls="{{ widget.attrs.id }}-listbox"
    class="w-full"
  >
    <span class="truncate"></span>
  </button>
  <div data-popover aria-hidden="true">
    <div
      role="listbox"
      id="{{ widget.attrs.id }}-listbox"
      aria-labelledby="{{ widget.attrs.id }}-trigger"
      {% if widget.attrs.multiple %}aria-multiselectable="true"{% endif %}
    >
      {% for group_name, group_choices, group_index in widget.optgroups %}
        {% for option in group_choices %}
          <div role="option" data-value="{{ option.value }}" {% if option.selected %}aria-selected="true"{% endif %}>
            {{ option.label }}
          </div>
        {% endfor %}
      {% endfor %}
    </div>
  </div>
  <input type="hidden" name="{{ widget.name }}" value="{{ widget.value_json|safe }}">
</div>
