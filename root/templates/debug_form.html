{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "debug form" %} | relay{% endblock %}
{% block content %}
  <div class="max-w-2xl">
    <h2 class="mb-6">{% translate "debug form" %}</h2>
    <form method="post">
      {% csrf_token %}
      <fieldset class="fieldset">
        {{ form }}
      </fieldset>
      <div class="flex gap-2 mt-6">
        <button type="submit" class="btn">{% translate "submit" %}</button>
      </div>
    </form>
  </div>
{% endblock %}
