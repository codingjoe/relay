{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "reset password"|capfirst %} | relay{% endblock %}
{% block content %}
  <div class="flex flex-col items-center justify-center text-center gap-6 py-12">
    <h1 class="text-4xl font-bold m-0 flex items-center gap-3">
      <i data-lucide="mailboxes" class="size-8" aria-hidden="true"></i>
      relay
    </h1>
    <h2 class="text-xl text-muted-foreground m-0">{% translate "reset your password"|title %}</h2>
    <form method="post" class="w-full max-w-sm">
      {% csrf_token %}
      <fieldset class="fieldset">
        {{ form }}
      </fieldset>
      <button type="submit" class="btn btn-primary w-full mt-4">{% translate "reset password"|capfirst %}</button>
    </form>
  </div>
{% endblock %}
