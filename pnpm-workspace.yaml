# pnpm 11 requires both: it fails on versions younger than its supply-chain
# window and on ignored build scripts. Drop an exclusion once it ages out.
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - esimport@0.10.2
  - echarts@6.1.0
  - brace-expansion@5.0.10 || 5.0.11 || 5.0.12
  - braces@3.0.4
  - katex@0.18.2
  - postcss-selector-parser@7.1.6
