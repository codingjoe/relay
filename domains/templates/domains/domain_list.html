{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "domains"|capfirst context "noun" %} — {{ m|title }}{% endblock %}
{% block content %}
  <div class="grid">
    <h2>{% translate "domains"|capfirst context "noun" %}</h2>
    <div class="text-right">
      <button onclick="document.getElementById('dlg-new-domain').showModal()">
        {% translate "add domain"|title context "noun" %}
      </button>
    </div>
  </div>
  <dialog id="dlg-new-domain">
    <form method="post" action="{% url 'domains:domain_create' %}">
      {% csrf_token %}
      <p>
        <label for="id_name">{% translate "domain"|capfirst context "noun" %}</label>
        <input type="text" name="name" id="id_name" placeholder="example.com" required>
      </p>
      <button type="submit">{% translate "add"|capfirst context "verb" %}</button>
      <button type="button" onclick="document.getElementById('dlg-new-domain').close()" class="outline">
        {% translate "cancel"|capfirst context "verb" %}
      </button>
    </form>
  </dialog>
  <figure>
    <table>
      <thead>
        <tr>
          <th>{% translate "domain"|capfirst context "noun" %}</th>
          <th>{% translate "sender subdomain"|title %}</th>
          <th>{% translate "verified"|capfirst %}</th>
          <th>Nameserver</th>
          <th>DMARC</th>
        </tr>
      </thead>
      <tbody>
        {% for domain in domains %}
          <tr>
            <td><a href="{% url 'domains:domain_detail' domain.pk %}">{{ domain.name }}</a></td>
            <td><code>{{ domain.sender_domain }}</code></td>
            <td>
              {% if domain.verified_at %}✅ {% translate "verified"|capfirst %}{% else %}⏳
                {% translate "pending"|capfirst %}{% endif %}
            </td>
            <td>{{ domain.nameserver_status }}</td>
            <td>{{ domain.dmarc_status }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="5">{% translate "no domains configured yet." %}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </figure>
{% endblock %}
