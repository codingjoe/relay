{% load i18n %}
<input
  type="text"
  readonly
  value="{% if quote %}&quot;{{ record_value }}&quot;{% else %}{{ record_value }}.{% endif %}"
  data-select
>
<button
  type="button"
  class="btn"
  data-variant="ghost"
  data-size="icon-xs"
  data-copy="{{ record_value }}{% if trailing_dot %}.{% endif %}"
  aria-label='{% translate "copy value"|capfirst %}'
>
  <i data-lucide="copy" class="size-3.5" aria-hidden="true"></i>
</button>
