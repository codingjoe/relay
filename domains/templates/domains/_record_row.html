<div class="input-group flex-wrap max-sm:h-auto">
  {% include "domains/_record_name.html" with record_type=record_type record_name=record_name %}
  <span class="mx-1 shrink-0 select-none text-muted-foreground" aria-hidden="true">→</span>
  {% if priority %}
    <input
      class="basis-12 flex-none"
      type="text"
      readonly
      value="{{ priority }}"
      data-select
    >
  {% endif %}
  {% include "domains/_record_value.html" with record_value=record_value quote=quote %}
</div>
