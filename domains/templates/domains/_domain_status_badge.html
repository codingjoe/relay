{% load i18n %}
{% if domain.is_verified %}
  <span class="badge" data-size="sm">
    <i data-lucide="circle-check" class="size-3.5" aria-hidden="true"></i>
    {% translate "verified"|capfirst %}
  </span>
{% elif domain.dns_checked_at %}
  <span class="badge" data-size="sm" data-variant="destructive">
    <i data-lucide="circle-x" class="size-3.5" aria-hidden="true"></i>
    {% translate "not verified"|capfirst %}
  </span>
{% else %}
  <span class="badge" data-size="sm" data-variant="outline">
    <i data-lucide="circle-dashed" class="size-3.5" aria-hidden="true"></i>
    {% translate "not verified"|capfirst %}
  </span>
{% endif %}
