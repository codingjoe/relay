{% load abstract i18n %}
<span data-align="start">{{ record_type }}</span>
<input
  class="max-sm:basis-[calc(100%-2.75rem)] text-right"
  type="text"
  readonly
  value="{{ record_name|relative_record_name:domain }}"
  data-select
>
<span class="select-none ps-1 text-sm text-muted-foreground empty:hidden">{{ record_name|apex_suffix:domain }}</span>
<button
  type="button"
  class="btn"
  data-variant="ghost"
  data-size="icon-xs"
  data-copy="{{ record_name|relative_record_name:domain }}"
  aria-label='{% translate "copy name"|capfirst %}'
>
  {% tabler name="copy" size="3.5" %}
</button>
