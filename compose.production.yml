include:
  - oci://docker.io/codingjoe/the-box-postgres:main
  - oci://docker.io/codingjoe/the-box-redis:main
services:
  dns:
    ports:
      - '0.0.0.0:53:53/udp'
      - '0.0.0.0:53:53/tcp'
    command: [ "-m", "manage", "dns" ]
    labels: !reset []
    deploy: !reset {}
    extends:
      service: web
  migration:
    depends_on: !override
      postgres:
        condition: service_healthy
        required: true
        restart: true
      redis:
        condition: service_healthy
        required: true
        restart: true
    command: [ "-m", "manage", "migrate", "--noinput" ]
    restart: no
    labels: !reset []
    deploy: !reset {}
    extends:
      service: web
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    volumes:
      - s3:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '0.0.0.0:9001:9001'
    networks:
      - app
      - app-wan
    command: [ "server", "/data", "--console-address", ":9001" ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
        required: true
        restart: true
    networks:
      - app
    command:
      - mc alias set root http://minio:9000 minioadmin ${MINIO_ROOT_PASSWORD} && mc mb root/relay --ignore-existing
    entrypoint: [ "/bin/sh", "-c" ]
    restart: "no"
  mx:
    ports:
      - '0.0.0.0:25:25'
    command: [ "-m", "manage", "mx" ]
    labels: !reset []
    deploy: !reset {}
    extends:
      service: web
  smtp:
    ports:
      - '0.0.0.0:587:587'
    command: [ "-m", "manage", "smtp" ]
    labels: !reset []
    deploy: !reset {}
    extends:
      service: web
  web:
    image: !reset "null" # dclint disable-line service-image-require-explicit-tag
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
        required: true
        restart: true
    environment:
      HOSTNAME: ${HOSTNAME:-localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}
      DEBUG: ${DEBUG:-false}
      GRANIAN_INTERFACE: asgi # Options: asgi, wsgi, rsgi (default)
      GRANIAN_LOG_ACCESS_ENABLED: true
      GRANIAN_WORKERS: ${WEB_CONCURRENCY:-2}
      GRANIAN_LOG_ACCESS_FMT: '{"addr": "%(addr)s", "time": "%(time)s", "dt_ms": %(dt_ms)f, "status": %(status)d, "path": "%(path)s", "query_string": "%(query_string)s", "method": "%(method)s", "scheme": "%(scheme)s", "protocol": "%(protocol)s"}' # JSON format
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ACCESS_KEY_ID: minioadmin
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: relay
      AWS_S3_ADDRESSING_STYLE: path
      RELAY_DNS_SMTP_IPS: ${RELAY_DNS_SMTP_IPS}
    command: [ "-m", "granian", "--port", "${PORT:-8000}", "--host", "0.0.0.0", "root.asgi:application" ]
    healthcheck:
      test: [ "CMD", "python", "-m", "manage", "health_check", "health", "localhost:${PORT:-8000}", "--forwarded-host", "${HOSTNAME:-localhost}", "--forwarded-proto", "https" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels:
      - "caddy=${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}"
      - "caddy.reverse_proxy.health_uri=/health/"
      - "caddy.cache"
    pull_policy: build
  worker:
    command: [ "-m", "manage", "threadmill", "worker" ]
    labels: !reset []
    deploy: !reset {}
    extends:
      service: web
volumes:
  s3:
