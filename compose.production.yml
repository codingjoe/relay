include:
  - oci://docker.io/codingjoe/the-box-postgres:latest
  - oci://docker.io/codingjoe/the-box-redis:latest
x-relay-secrets: &relay-secrets
  SECRET_KEY:
  KMS_FERNET_KEY:
  KMS_FERNET_LEGACY_KEYS:
  RELAY_ENVIRONMENT: production
services:
  web:
    pull_policy: build
    image: !reset
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    environment:
      !!merge <<: *relay-secrets
      HOSTNAME: ${HOSTNAME:-localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}
      DEBUG: ${DEBUG:-false}
      GRANIAN_INTERFACE: asgi # Options: asgi, wsgi, rsgi (default)
      GRANIAN_LOG_ACCESS_ENABLED: true
      GRANIAN_WORKERS: ${WEB_CONCURRENCY:-2}
      GRANIAN_LOG_ACCESS_FMT: '{"addr": "%(addr)s", "time": "%(time)s", "dt_ms": %(dt_ms)f, "status": %(status)d, "path": "%(path)s", "query_string": "%(query_string)s", "method": "%(method)s", "scheme": "%(scheme)s", "protocol": "%(protocol)s"}' # JSON format
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    command: ["-m", "granian", "--port", "${PORT:-8000}", "--host", "0.0.0.0", "root.asgi:application"]
    healthcheck:
      test: ["CMD", "python", "-m", "manage", "health_check", "health", "localhost:${PORT:-8000}", "--forwarded-host", "${HOSTNAME:-localhost}", "--forwarded-proto", "https"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
      #    depends_on:
      #      migration:
      #        condition: service_completed_successfully
    labels:
      - "caddy=${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}"
      - "caddy.reverse_proxy.health_uri=/health/"
      - "caddy.cache"
  dns:
    pull_policy: build
    image: !reset
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    command: ["-m", "manage", "dns"]
    environment:
      !!merge <<: *relay-secrets
      RELAY_DNS_LISTEN_HOST: 0.0.0.0
      RELAY_DNS_LISTEN_PORT: 5353
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    networks:
      - app
  dnsdist:
    image: powerdns/dnsdist-21@sha256:28100b260120b2f4fdcef6e973f5553966977c2ec4576ed2d849b1dc9d3278ea
    depends_on:
      dns:
        condition: service_started
    volumes:
      - ./dnsdist.conf:/etc/dnsdist/conf.d/relay.conf:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      - app
      - app-wan
  smtp:
    pull_policy: build
    image: !reset
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    command: ["-m", "manage", "smtp"]
    environment:
      !!merge <<: *relay-secrets
      RELAY_SMTP_ALLOW_INSECURE:
      RELAY_SMTP_TLS_CERT_PATH:
      RELAY_SMTP_TLS_KEY_PATH:
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    ports:
      - "587:587"
    networks:
      - app
      - app-wan
  mx:
    pull_policy: build
    image: !reset
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    command: ["-m", "manage", "mx"]
    environment:
      !!merge <<: *relay-secrets
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    ports:
      - "25:25"
    networks:
      - app
      - app-wan
  worker:
    pull_policy: build
    image: !reset
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    command: ["-m", "manage", "threadmill", "worker"]
    environment:
      !!merge <<: *relay-secrets
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
