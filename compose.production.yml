include:
  - oci://ghcr.io/codingjoe/the-box-postgres:main
  - oci://ghcr.io/codingjoe/the-box-redis:main
services:
  clamav:
    image: clamav/clamav:1.5
    volumes:
      - clamav:/var/lib/clamav
    # Avoid the daily memory spike from concurrent signature reloads.
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      # Alert on archives exceeding MaxFileSize instead of scanning them clean.
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_StreamMaxLength: "40M" # above the 2**25 SMTP DATA limit
      FRESHCLAM_CONF_TestDatabases: "no"
    networks:
      - app
      - app-wan # freshclam needs egress for signature updates
    restart: unless-stopped
    labels:
      - dev.dozzle.icon=clam-av
    deploy:
      resources:
        limits:
          memory: 4g # clamd needs 3-4 GiB
  dns:
    networks: !override
      - app
      - dnsdist
    command: [ "-m", "manage", "dns", "--port", "5353" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import dns.message, dns.query; dns.query.udp(dns.message.make_query('relay.health', 'A'), '127.0.0.1', port=5353, timeout=5)" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    # Dozzle app icons, see https://dozzle.dev/guide/app-icons. The slugs are
    # upstream dashboard-icons names and only render once Dozzle bundles them,
    # see https://github.com/amir20/dozzle/issues/4988.
    labels: !override
      - dev.dozzle.icon=django
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    extends:
      service: web
  dnsdist:
    image: powerdns/dnsdist-21:2.1.1
    depends_on:
      dns:
        condition: service_started
    configs:
      - source: dnsdist
        target: /etc/dnsdist/dnsdist.conf
    ports:
      - '0.0.0.0:53:53/udp'
      - '0.0.0.0:53:53/tcp'
    networks:
      - dnsdist
      - dnsdist-wan
    labels:
      - dev.dozzle.icon=powerdns
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
  migration:
    depends_on: !override
      postgres:
        condition: service_healthy
        required: true
        restart: false
      redis:
        condition: service_healthy
        required: true
        restart: false
    command: [ "-m", "manage", "migrate", "--noinput" ]
    restart: no
    labels: !override
      - dev.dozzle.icon=django
    deploy: !reset {}
    extends:
      service: web
    memswap_limit: !reset ""
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    volumes:
      - s3:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - app
      - app-wan
    command: [ "server", "/data", "--console-address", ":9001" ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
        required: true
        restart: true
    networks:
      - app
    command:
      - mc alias set root http://minio:9000 minioadmin ${MINIO_ROOT_PASSWORD} && mc mb root/relay --ignore-existing
    entrypoint: [ "/bin/sh", "-c" ]
    restart: "no"
  msa:
    volumes:
      - caddy_data:/data:ro
    # Caddy stores certs at <data>/certificates/<issuer>/<domain>/<domain>.crt|.key
    environment:
      RELAY_SMTP_TLS_CERT_PATH: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/smtp.${HOSTNAME:-localhost}/smtp.${HOSTNAME:-localhost}.crt
      RELAY_SMTP_TLS_KEY_PATH: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/smtp.${HOSTNAME:-localhost}/smtp.${HOSTNAME:-localhost}.key
      RELAY_PROXY_PROTOCOL_TIMEOUT: ${RELAY_PROXY_PROTOCOL_TIMEOUT:-3}
    command: [ "-m", "manage", "msa", "--ports", "587" ]
    healthcheck:
      # Caddy fronts the submission port with a PROXY protocol header.
      # Send the unattributed v1 "UNKNOWN" header, then expect the SMTP
      # banner.
      test: [ "CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 587), timeout=5); s.sendall(b'PROXY UNKNOWN\\r\\n'); assert s.recv(1024).startswith(b'220'); s.sendall(b'QUIT\\r\\n')" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels: !override
      - "caddy=smtp.${HOSTNAME:-localhost}"
      - "caddy.respond=OK"
      - dev.dozzle.icon=django
      - "caddy_1.layer4.:587.route.proxy=msa:587"
      - "caddy_1.layer4.:587.route.proxy.lb_policy=round_robin"
      - "caddy_1.layer4.:587.route.proxy.lb_try_duration=3s"
      - "caddy_1.layer4.:587.route.proxy.fail_duration=10s"
      - "caddy_1.layer4.:587.route.proxy.proxy_protocol=v2"
      - "caddy_1.layer4.:465.route.0_tls="
      - "caddy_1.layer4.:465.route.1_proxy=msa:2465"
      - "caddy_1.layer4.:465.route.1_proxy.lb_policy=round_robin"
      - "caddy_1.layer4.:465.route.1_proxy.lb_try_duration=3s"
      - "caddy_1.layer4.:465.route.1_proxy.fail_duration=10s"
      - "caddy_1.layer4.:465.route.1_proxy.proxy_protocol=v2"
    extends:
      service: web
  mta:
    volumes:
      - caddy_data:/data:ro
    # Caddy stores certs at <data>/certificates/<issuer>/<domain>/<domain>.crt|.key
    environment:
      RELAY_MX_TLS_CERT_PATH: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${HOSTNAME:-localhost}/mail.${HOSTNAME:-localhost}.crt
      RELAY_MX_TLS_KEY_PATH: /data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${HOSTNAME:-localhost}/mail.${HOSTNAME:-localhost}.key
      RELAY_PROXY_PROTOCOL_TIMEOUT: ${RELAY_PROXY_PROTOCOL_TIMEOUT:-3}
    command: [ "-m", "manage", "mta" ]
    healthcheck:
      # Caddy fronts the MX port with a PROXY protocol header. Send the
      # unattributed v1 "UNKNOWN" header, then expect the SMTP banner.
      test: [ "CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 25), timeout=5); s.sendall(b'PROXY UNKNOWN\\r\\n'); assert s.recv(1024).startswith(b'220'); s.sendall(b'QUIT\\r\\n')" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels: !override
      - "caddy=mail.${HOSTNAME:-localhost}"
      - "caddy.respond=OK"
      - dev.dozzle.icon=django
      - "caddy_1.layer4.:25.route.proxy=mta:25"
      - "caddy_1.layer4.:25.route.proxy.lb_policy=round_robin"
      - "caddy_1.layer4.:25.route.proxy.lb_try_duration=3s"
      - "caddy_1.layer4.:25.route.proxy.fail_duration=10s"
      - "caddy_1.layer4.:25.route.proxy.proxy_protocol=v2"
    extends:
      service: web
  rspamd:
    image: rspamd/rspamd:4.1
    depends_on:
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    configs:
      - source: rspamd_redis
        target: /etc/rspamd/local.d/redis.conf
      - source: rspamd_controller
        target: /etc/rspamd/local.d/worker-controller.inc
      - source: rspamd_antivirus
        target: /etc/rspamd/local.d/antivirus.conf
      - source: rspamd_force_actions
        target: /etc/rspamd/local.d/force_actions.conf
    networks:
      - app
    labels:
      - dev.dozzle.icon=rspamd
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
  web:
    image: ghcr.io/codingjoe/relay:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
        required: true
        restart: true
    environment:
      HOSTNAME: ${HOSTNAME:-localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}
      DEBUG: ${DEBUG:-false}
      GRANIAN_INTERFACE: asginl
      GRANIAN_LOG_ACCESS_ENABLED: true
      GRANIAN_WORKERS: ${WEB_CONCURRENCY:-2}
      GRANIAN_LOG_ACCESS_FMT: '{"addr": "%(addr)s", "time": "%(time)s", "dt_ms": %(dt_ms)f, "status": %(status)d, "path": "%(path)s", "query_string": "%(query_string)s", "method": "%(method)s", "scheme": "%(scheme)s", "protocol": "%(protocol)s"}' # JSON format
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ACCESS_KEY_ID: minioadmin
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: relay
      AWS_S3_ADDRESSING_STYLE: path
      RELAY_DNS_SMTP_IPS: ${RELAY_DNS_SMTP_IPS}
    command: [ "-m", "granian", "--port", "${PORT:-8000}", "--host", "0.0.0.0", "root.asgi:application" ]
    healthcheck:
      test: [ "CMD", "python", "-m", "manage", "health_check", "health", "localhost:${PORT:-8000}", "--forwarded-host", "${HOSTNAME:-localhost}", "--forwarded-proto", "https" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    labels:
      - "caddy=${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}"
      - "caddy.reverse_proxy.health_uri=/health/"
      - "caddy.cache"
      - dev.dozzle.icon=django
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    pull_policy: always
  worker:
    command: [ "-m", "manage", "threadmill", "worker", "--workers", "2", "--threads", "4", "--max-tasks", "10000", "--max-tasks-jitter", "100" ]
    healthcheck:
      test: [ "CMD", "python", "-m", "manage", "health_check", "health", "--no-http" ]
    labels: !override
      - dev.dozzle.icon=django
    deploy:
      resources:
        limits:
          memory: 1g
    extends:
      service: web
networks:
  dnsdist:
    internal: true
  dnsdist-wan:
volumes:
  s3:
  clamav:
  caddy_data:
    name: the-box_caddy_data
    external: true
configs:
  rspamd_redis:
    content: |
      servers = "redis";
      password = "${REDIS_PASSWORD}";
      database = 1;
  rspamd_controller:
    content: |
      secure_ip = "0.0.0.0/0";
      secure_ip = "::/0";
  rspamd_antivirus:
    content: |
      clamav {
        type = "clamav";
        servers = "clamav:3310";
        symbol = "CLAM_VIRUS";
        score = 10.0;
        action = "reject";
        # Matches StreamMaxLength; ARC sealing adds bytes after SMTP acceptance.
        max_size = 41943040;
      }
  rspamd_force_actions:
    content: |
      force_actions {
        rules {
          CLAMAV_FAIL {
            action = "soft reject";
            expression = "CLAM_VIRUS_FAIL";
          }
        }
      }
  dnsdist:
    content: |
      -- Listen on port 53 (UDP + TCP)
      addLocal("0.0.0.0:53")

      -- Authoritative nameserver: allow queries from all sources
      setACL({"0.0.0.0/0", "::/0"})

      -- Resolve all 'dns' service replicas via Docker's embedded DNS
      local handle = io.popen("getent ahosts dns")
      local result = handle:read("*a")
      handle:close()

      -- Add each unique replica as a downstream server for redundancy
      local seen = {}
      for ip in result:gmatch("(%d+%.%d+%.%d+%.%d+)") do
          if not seen[ip] then
              seen[ip] = true
              newServer({address=ip .. ":5353", name="authoritative"})
          end
      end

      -- Cache responses to reduce upstream load
      pc = newPacketCache(10000, {maxTTL=86400, minTTL=0})
      getPool(""):setCache(pc)
