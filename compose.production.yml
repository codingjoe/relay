include:
  - oci://docker.io/codingjoe/the-box-postgres:main
  - oci://docker.io/codingjoe/the-box-redis:main
services:
  web:
    pull_policy: build
    image: !reset
    build:
      context: .
      dockerfile: Dockerfile
      target: ${TARGET:-production}
      args:
        UV_NO_DEV: 0
    environment:
      HOSTNAME: ${HOSTNAME:-localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}
      DEBUG: ${DEBUG:-false}
      GRANIAN_INTERFACE: asgi # Options: asgi, wsgi, rsgi (default)
      GRANIAN_LOG_ACCESS_ENABLED: true
      GRANIAN_WORKERS: ${WEB_CONCURRENCY:-2}
      GRANIAN_LOG_ACCESS_FMT: '{"addr": "%(addr)s", "time": "%(time)s", "dt_ms": %(dt_ms)f, "status": %(status)d, "path": "%(path)s", "query_string": "%(query_string)s", "method": "%(method)s", "scheme": "%(scheme)s", "protocol": "%(protocol)s"}' # JSON format
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ACCESS_KEY_ID: minioadmin
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: relay
      AWS_S3_ADDRESSING_STYLE: path
      RELAY_DNS_SMTP_IPS: ${RELAY_DNS_SMTP_IPS}
    command: ["-m", "granian", "--port", "${PORT:-8000}", "--host", "0.0.0.0", "root.asgi:application"]
    healthcheck:
      test: ["CMD", "python", "-m", "manage", "health_check", "health", "localhost:${PORT:-8000}", "--forwarded-host", "${HOSTNAME:-localhost}", "--forwarded-proto", "https"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
        required: true
        restart: true
    labels:
      - "caddy=${ALLOWED_HOSTS:-${HOSTNAME:-localhost}}"
      - "caddy.reverse_proxy.health_uri=/health/"
      - "caddy.cache"
  dns:
    extends:
      service: web
    labels: !reset
    command: ["-m", "manage", "dns", "--port", "5353"]
    networks: !override
      - app
      - dnsdist
  dnsdist:
    image: powerdns/dnsdist-21:2.1.1
    ports:
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
    networks:
      - dnsdist
      - dnsdist-wan
    configs:
      - source: dnsdist
        target: /etc/dnsdist/dnsdist.conf
    depends_on:
      dns:
        condition: service_started
  smtp:
    extends:
      service: web
    labels: !override
      - "caddy=smtp.${HOSTNAME:-localhost}"
      - "caddy.respond=OK"
    deploy: !reset
    command: ["-m", "manage", "smtp"]
    # Caddy stores certs at <data>/certificates/<issuer>/<domain>/<domain>.crt|.key
    environment:
      RELAY_SMTP_TLS_CERT_PATH: /data/certificates/acme-v02.api.letsencrypt.org-directory/smtp.${HOSTNAME:-localhost}/smtp.${HOSTNAME:-localhost}.crt
      RELAY_SMTP_TLS_KEY_PATH: /data/certificates/acme-v02.api.letsencrypt.org-directory/smtp.${HOSTNAME:-localhost}/smtp.${HOSTNAME:-localhost}.key
    volumes:
      - caddy_data:/data:ro
    networks: !override
      - app
  mx:
    extends:
      service: web
    labels: !override
      - "caddy=mail.${HOSTNAME:-localhost}"
      - "caddy.respond=OK"
    deploy: !reset
    command: ["-m", "manage", "mx"]
    # Caddy stores certs at <data>/certificates/<issuer>/<domain>/<domain>.crt|.key
    environment:
      RELAY_MX_TLS_CERT_PATH: /data/certificates/acme-v02.api.letsencrypt.org-directory/mail.${HOSTNAME:-localhost}/mail.${HOSTNAME:-localhost}.crt
      RELAY_MX_TLS_KEY_PATH: /data/certificates/acme-v02.api.letsencrypt.org-directory/mail.${HOSTNAME:-localhost}/mail.${HOSTNAME:-localhost}.key
    volumes:
      - caddy_data:/data:ro
    networks: !override
      - app
  haproxy:
    image: haproxy:3.2
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    environment:
      HOSTNAME: ${HOSTNAME:-localhost}
    entrypoint: ["sh", "-c"]
    command: ["umask 077 && cat /data/certificates/acme-v02.api.letsencrypt.org-directory/smtp.$$HOSTNAME/smtp.$$HOSTNAME.crt /data/certificates/acme-v02.api.letsencrypt.org-directory/smtp.$$HOSTNAME/smtp.$$HOSTNAME.key > /run/smtp.pem && exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg"]
    volumes:
      - caddy_data:/data:ro
    networks:
      - app
      - app-wan
    configs:
      - source: haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      smtp:
        condition: service_started
      mx:
        condition: service_started
  rspamd:
    image: rspamd/rspamd:4.1
    configs:
      - source: rspamd_redis
        target: /etc/rspamd/local.d/redis.conf
      - source: rspamd_worker
        target: /etc/rspamd/local.d/worker-normal.inc
    networks:
      - app
    depends_on:
      redis:
        condition: service_healthy
  worker:
    extends:
      service: web
    labels: !reset
    deploy: !reset
    command: ["-m", "manage", "threadmill", "worker"]
  migration:
    extends:
      service: web
    restart: no
    command: ["-m", "manage", "migrate", "--noinput"]
    deploy: !reset
    labels: !reset
    depends_on: !override
      postgres:
        condition: service_healthy
        required: true
        restart: true
      redis:
        condition: service_healthy
        required: true
        restart: true
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - app
      - app-wan
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
        required: true
        restart: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set root http://minio:9000 minioadmin ${MINIO_ROOT_PASSWORD} && mc mb root/relay --ignore-existing
    restart: "no"
    networks:
      - app
volumes:
  s3:
  caddy_data:
networks:
  dnsdist:
    internal: true
  dnsdist-wan:
configs:
  rspamd_redis:
    content: |
      servers = "redis";
      database = 1;
  rspamd_worker:
    content: |
      bind_socket = "*:11334";
  haproxy:
    content: |
      global
          log stdout format raw local0

      defaults
          log global
          mode tcp
          option tcplog
          timeout connect 10s
          timeout client 5m
          timeout server 5m

      # Shared rate-limit tables (per-IP, shared across frontends)
      backend mx_rate_limits
          stick-table type ip size 100k expire 30s store conn_rate(10s)

      backend submission_rate_limits
          stick-table type ip size 100k expire 30s store conn_rate(10s)

      # MX receiving: port 25 (STARTTLS) with PROXY protocol
      frontend mx_25
          bind *:25
          tcp-request connection track-sc0 src table mx_rate_limits
          tcp-request connection reject if { sc0_conn_rate(mx_rate_limits) gt 50 }
          default_backend mx_backend

      backend mx_backend
          option smtpchk EHLO relay.local
          server mx mx:25 send-proxy check

      # SMTP submission: port 587 (STARTTLS) with PROXY protocol
      frontend smtp_587
          bind *:587
          tcp-request connection track-sc0 src table submission_rate_limits
          tcp-request connection reject if { sc0_conn_rate(submission_rate_limits) gt 20 }
          default_backend smtp_587_backend

      backend smtp_587_backend
          option smtpchk EHLO relay.local
          server smtp smtp:587 send-proxy check

      # SMTP submission: port 465 (implicit TLS, HAProxy terminates TLS)
      frontend smtp_465
          bind *:465 ssl crt /run/smtp.pem
          tcp-request connection track-sc0 src table submission_rate_limits
          tcp-request connection reject if { sc0_conn_rate(submission_rate_limits) gt 20 }
          default_backend smtp_465_backend

      backend smtp_465_backend
          server smtp smtp:465 send-proxy check
  dnsdist:
    content: |
      -- Listen on port 53 (UDP + TCP)
      addLocal("0.0.0.0:53")

      -- Authoritative nameserver: allow queries from all sources
      setACL({"0.0.0.0/0", "::/0"})

      -- Resolve all 'dns' service replicas via Docker's embedded DNS
      local handle = io.popen("getent ahosts dns")
      local result = handle:read("*a")
      handle:close()

      -- Add each unique replica as a downstream server for redundancy
      local seen = {}
      for ip in result:gmatch("(%d+%.%d+%.%d+%.%d+)") do
          if not seen[ip] then
              seen[ip] = true
              newServer({address=ip .. ":5353", name="authoritative"})
          end
      end

      -- Cache responses to reduce upstream load
      pc = newPacketCache(10000, {maxTTL=86400, minTTL=0})
      getPool(""):setCache(pc)
