[project]
name = "relay"
version = "0.1.0"
description = "A digital infrastructure platform for email, VoIP, and more"
readme = "README.md"
requires-python = "~=3.14.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "abnf>=2.9",
  "aiosmtpd>=1.4.6",
  "aiosmtplib>=5.1.2",
  "authres>=1.2",
  "boto3>=1.43.83",
  "cryptography>=50.0.1",
  "django>=6.1,<6.2",
  "django-environ>=0.14",
  "django-health-check[psutil,redis]>=4.5.1",
  "django-storages[s3]>=1.14.6",
  "djangorestframework>=3.18",
  "dkimpy>=1.1.8",
  "dnslib>=0.9.26",
  "dnspython>=2.8",
  "granian>=2.8.2",
  "httpx>=0.28.1",
  "idna>=3.19",
  "markdown>=3.10.3",
  "psycopg[binary,pool]>=3.3.4",
  "pygments>=2.21",
  "pynacl>=1.6.2",
  "python-frontmatter>=1.3",
  "pyyaml>=6.0.3",
  "redis>=8.1",
  "sentry-sdk>=2.68.1",
  "social-auth-app-django>=6.0.1",
  "threadmill[redis]>=0.6.1",
  "validators>=0.35",
  "whitenoise>=6.12",
]

[dependency-groups]
dev = [
  "django-debug-toolbar>=7.1.1",
  "django-devbar>=0.7",
  "pytest-pretty>=1.3",
  "pyyaml>=6.0.3",
  "threadmill[inspector]>=0.6.1",
  { include-group = "test" },
]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "pytest-django>=4.14",
  "pytest-env>=1.7",
  "pytest-randomly>=4.1",
  "pytest-xdist>=3.8",
]

[tool.ruff]
lint.extend-select = [
  "C90",
  "D",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
lint.ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]

[tool.ruff.lint.per-file-ignores]
# aiosmtpd and python-markdown require these method names by protocol.
"abstract/utils.py" = [ "N802" ]
"services/email/msa/handlers.py" = [ "N802" ]
"services/email/mta/handlers.py" = [ "N802" ]
"services/email/proxy_protocol.py" = [ "N802" ]

[tool.pytest]
addopts = [ "--tb=native", "--fail-on-template-vars", "--reuse-db", "-n", "auto", "-q" ]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "root.settings"
env = [
  "DJANGO_ALLOW_ASYNC_UNSAFE=1",
  "TEST=1",
]
filterwarnings = [
  "ignore:Setting ModelAdmin.list_select_related:django.utils.deprecation.RemovedInDjango70Warning",
]
norecursedirs = [ "storage", ".venv", "node_modules", ".direnv", ".git", ".worktrees" ]
python_files = [ "tests.py", "test_*.py", "*_tests.py" ]

[tool.coverage]
report.omit = [
  "*/baker_recipes.py",
  "*/migrations/*",
  "*/tests/*",
  ".venv/*",
  "conftest.py",
  "manage.py",
  "node_modules/*",
]
report.skip_covered = true
report.skip_empty = true
report.show_missing = true

[tool.importlinter]
root_packages = [
  "abstract",
  "accounts",
  "alternative_to",
  "docs",
  "domains",
  "know_how",
  "kms",
  "legal",
  "root",
  "services",
  "well_known",
]

[[tool.importlinter.contracts]]
name = "Abstract depends on no first-party app"
type = "forbidden"
source_modules = [ "abstract" ]
forbidden_modules = [
  "accounts",
  "alternative_to",
  "docs",
  "domains",
  "know_how",
  "kms",
  "legal",
  "root",
  "services.email.dashboard",
  "services.email.dmarc",
  "services.email.message",
  "services.email.msa",
  "services.email.mta",
  "services.email.mta_sts",
  "services.email.proxy_protocol",
  "services.email.reputation",
  "services.email.spam",
  "services.email.tls",
  "well_known",
]

[[tool.importlinter.contracts]]
name = "KMS depends on no first-party app except abstract"
type = "forbidden"
