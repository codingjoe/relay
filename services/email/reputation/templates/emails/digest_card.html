{% comment %}
  One status card of the digest mail: the same three cards the monitoring
  dashboard opens with, so the mail reads at a glance.
{% endcomment %}
<td width="33%" valign="top" style="padding: 0 4px">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
    <tr>
      <td bgcolor="{{ background }}" style="border-radius: 10px; padding: 14px">
        <p style="margin: 0; font-size: 12px; line-height: 16px; color: #5d5d5d">{{ label }}</p>
        <p style="margin: 2px 0 0; font-size: 22px; line-height: 30px; font-weight: 700; color: {{ colour }}">
          {{ value }}
        </p>
        <p style="margin: 4px 0 0; font-size: 12px; line-height: 16px; color: #5d5d5d">{{ caption }}</p>
      </td>
    </tr>
  </table>
</td>
