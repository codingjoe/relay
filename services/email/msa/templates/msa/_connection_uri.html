{% load abstract i18n %}
<div class="flex flex-col gap-3">
  <div class="flex flex-col gap-1">
    <p class="m-0 text-sm text-muted-foreground">smtps</p>
    <div class="input-group">
      <input
        class="break-all"
        type="text"
        readonly
        value="{{ smtp_uri }}"
        data-select
        aria-label='{% translate "connection URI"|capfirst %}'
      >
      <button
        type="button"
        class="btn"
        data-variant="ghost"
        data-size="icon-xs"
        data-copy="{{ smtp_uri }}"
        aria-label='{% translate "copy connection URI"|capfirst %}'
      >
        {% tabler name="copy" size="3.5" %}
      </button>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <p class="m-0 text-sm text-muted-foreground">Django (EMAIL_URL)</p>
    <div class="input-group">
      <input
        class="break-all"
        type="text"
        readonly
        value="{{ smtp_django_uri }}"
        data-select
        aria-label='{% translate "django connection URI"|capfirst %}'
      >
      <button
        type="button"
        class="btn"
        data-variant="ghost"
        data-size="icon-xs"
        data-copy="{{ smtp_django_uri }}"
        aria-label='{% translate "copy django connection URI"|capfirst %}'
      >
        {% tabler name="copy" size="3.5" %}
      </button>
    </div>
  </div>
</div>
