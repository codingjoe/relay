{% load i18n %}
<div class="input-group">
  <input
    class="break-all"
    type="text"
    readonly
    value="{{ smtp_uri }}"
    data-select
    aria-label='{% translate "connection URI"|capfirst %}'
  >
  <button
    type="button"
    class="btn"
    data-variant="ghost"
    data-size="icon-xs"
    data-copy="{{ smtp_uri }}"
    aria-label='{% translate "copy connection URI"|capfirst %}'
  >
    <i data-lucide="copy" class="size-3.5" aria-hidden="true"></i>
  </button>
</div>
