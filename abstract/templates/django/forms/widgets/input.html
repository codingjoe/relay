{% comment %}
Override Django's default input widget to add the basecoat `input` class.
All sub-widgets (text, email, password, number, date, etc.) include this
template, so the override cascades automatically.
{% endcomment %}
<input
  type="{{ widget.type }}"
  name="{{ widget.name }}"
  class="input {{ widget.attrs.class|default:'' }}"
  {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
  {% for name, value in widget.attrs.items %}
    {% if name != 'class' and value is not False %}
      {% if value is True %}{{ name }}{% else %}{{ name }}="{{ value|stringformat:'s' }}"{% endif %}
    {% endif %}
  {% endfor %}
>
