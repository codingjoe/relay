<input
  type="checkbox"
  name="{{ widget.name }}"
  class="checkbox{% for name, value in widget.attrs.items %}{% if name == 'class' %} {{ value }}{% endif %}{% endfor %}"
  {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
  {% for name, value in widget.attrs.items %}
    {% if name != 'class' and value is not False %}
      {% if value is True %}{{ name }}{% else %}{{ name }}="{{ value|stringformat:'s' }}"{% endif %}
    {% endif %}
  {% endfor %}
>
