<textarea
  name="{{ widget.name }}"
  class="textarea{% for name, value in widget.attrs.items %}{% if name == 'class' %} {{ value }}{% endif %}{% endfor %}"
  {% for name, value in widget.attrs.items %}{% if name != 'class' and value is not False %}{% if value is True %} {{ name }}{% else %} {{ name }}="{{ value|stringformat:'s' }}"{% endif %}{% endif %}{% endfor %}
>{% if widget.value %}{{ widget.value|stringformat:'s' }}{% endif %}</textarea>
