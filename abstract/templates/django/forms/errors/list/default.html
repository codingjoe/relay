{% load i18n %}{% if errors %}<div class="field">
    <fieldset class="fieldset" {% if errors.field_id %}id="{{ errors.field_id }}_error"{% endif %}>
      <legend role="alert">{% translate "error"|capfirst %}</legend>
      {% for error in errors %}<p role="alert">{{ error }}</p>{% endfor %}
    </fieldset>
  </div>{% endif %}
