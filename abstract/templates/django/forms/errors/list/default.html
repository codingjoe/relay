{% load i18n %}{% if errors %}<fieldset
    class="fieldset"
    {% if errors.field_id %}id="{{ errors.field_id }}_error"{% endif %}
  >
    <legend role="alert">{% translate "error"|capfirst %}</legend>
    {% for error in errors %}<div class="field"><p role="alert">{{ error }}</p></div>{% endfor %}
  </fieldset>{% endif %}
