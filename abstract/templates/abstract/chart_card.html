{% load i18n static abstract %}
<section class="card {{ class }}">
  <header>
    <h3 class="m-0">{{ title }}</h3>
    <p class="m-0 text-muted-foreground">
      {% if chart.subtitle %}
        {{ chart.subtitle }}
      {% else %}
        {% blocktranslate count days=chart.rows|length trimmed %}
          {{ days }} day{% plural %}{{ days }} days
        {% endblocktranslate %}
      {% endif %}
    </p>
  </header>
  <div
    id="{{ id }}"
    class="h-72"
    role="img"
    aria-label="{{ title }}"
    data-chart="{{ data_id }}"
  >
  </div>
  {{ chart|json_script:data_id }}
  <script type="module" src="{% static 'abstract/chart_card.js' %}"></script>
</section>
