{% load i18n abstract %}
<section class="card {{ class }}">
  <header>
    <h3 class="m-0">{{ title }}</h3>
  </header>
  <canvas id="{{ id }}" class="h-72" aria-label="{{ title }}"></canvas>
  {{ chart.rows|json_script:data_id }}
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.basecoat.chart("#{{ id }}", {
        type: "line",
        labelKey: "day",
        data: JSON.parse(document.getElementById("{{ data_id }}").textContent),
        series: {
        {% for s in chart.series %}
          "{{ s.key }}": {
            label: "{{ s.label|capfirst }}",
            color: "{{ s.color }}",
            surface: "gradient",
            dataset: {
              fill: true,
              tension: 0.35,
              stack: "status",
              pointRadius: 0,
              pointHoverRadius: 4,
            },
          }{% if not forloop.last %},{% endif %}
        {% endfor %}
        },
        options: {
          scales: {
            x: {
              ticks: {
                maxTicksLimit: 6,
                callback: function (value) {
                  return new Intl.DateTimeFormat(document.documentElement.lang, {
                    month: "short",
                    day: "numeric",
                  }).format(new Date(this.getLabelForValue(value)));
                },
              },
            },
            y: { stacked: true, beginAtZero: true },
          },
          plugins: {
            tooltip: {
              mode: "index",
              callbacks: {
                title: (items) =>
                  new Intl.DateTimeFormat(document.documentElement.lang, {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                  }).format(new Date(items[0].label)),
              },
            },
          },
        },
      });
    });
  </script>
</section>
