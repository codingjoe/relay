{% load i18n static abstract %}
<section class="card {{ class }}">
  <header>
    <h3 class="m-0">{{ title }}</h3>
    <p class="m-0 text-muted-foreground">
      {% if chart.subtitle %}
        {{ chart.subtitle }}
      {% else %}
        {% blocktranslate count days=chart.rows|length trimmed %}
          {{ days }} day{% plural %}{{ days }} days
        {% endblocktranslate %}
      {% endif %}
    </p>
  </header>
  <div id="{{ id }}" class="h-72" role="img" aria-label="{{ title }}"></div>
  {{ chart.rows|json_script:data_id }}
  <script type="module">
    import * as echarts from "https://esm.sh/echarts@5.6.0";
    import { toRgba } from "{% static 'abstract/chart.js' %}";
    import escapeHtml from "https://esm.sh/lodash.escape@4.0.1";
    const element = document.getElementById("{{ id }}");
    if (element) {
      const rows = JSON.parse(document.getElementById("{{ data_id }}").textContent);
      const locale = document.documentElement.lang;
      const fullDate = new Intl.DateTimeFormat(locale, {
        year: "numeric",
        month: "long",
        day: "numeric",
        timeZone: "UTC",
      });
      const shortDate = new Intl.DateTimeFormat(locale, { month: "short", day: "numeric", timeZone: "UTC" });
      const percent = {% if chart.y_scale.percent %}true{% else %}false{% endif %};
      const muted = toRgba("var(--color-muted-foreground)");
      const border = toRgba("var(--color-border)");
      const diverging = {% if chart.y_scale.diverging %}true{% else %}false{% endif %};
      /* Grow the axis past the threshold, so the limit line stays inside the plot. */
      const axisMax = (threshold) => (value) => {
        const highest = Math.max(
          Number.isFinite(value.max) ? value.max : 0,
          threshold,
        );
        // A ceiling would round a 0.1 per cent limit up to a whole one.
        return percent ? highest * 1.1 : Math.ceil(highest * 1.05);
      };
      const formatValue = (value) => {
        if (value === null || value === undefined) return "-";
        return String(diverging ? Math.abs(value) : value);
      };
      const palette = [
        "--color-chart-blue",
        "--color-chart-green",
        "--color-chart-yellow",
        "--color-chart-red",
        "--color-chart-green-deep",
        "--color-chart-orange",
        "--color-chart-gray",
      ].map((name) => toRgba(`var(${name})`));
      echarts.registerTheme("relay", {
        color: palette,
        textStyle: { fontFamily: getComputedStyle(document.documentElement).fontFamily },
        categoryAxis: {
          axisLine: { lineStyle: { color: border } },
          axisTick: { show: false },
          axisLabel: { color: muted },
        },
        valueAxis: {
          axisLabel: { color: muted },
          splitLine: { lineStyle: { color: border } },
        },
        tooltip: {
          backgroundColor: toRgba("var(--color-popover)"),
          borderColor: border,
          textStyle: { color: toRgba("var(--color-popover-foreground)") },
        },
      });
      const chart = echarts.init(element, "relay");
      chart.setOption({
        grid: { left: 8, right: 16, top: 8, bottom: 8, containLabel: true },
        tooltip: {
          trigger: "axis",
          confine: true,
          formatter: (items) =>
            [
              escapeHtml(fullDate.format(new Date(items[0].axisValue))),
              ...items.map((item) => {
                const text = formatValue(item.value);
                return `${item.marker}${escapeHtml(item.seriesName)}: ${escapeHtml(text)}${percent && text !== "-" ? "%" : ""}`;
              }),
            ].join("<br/>"),
        },
        xAxis: {
          type: "category",
          data: rows.map((row) => row.day),
          axisLabel: {
            interval: Math.max(Math.ceil(rows.length / 6) - 1, 0),
            formatter: (value) => shortDate.format(new Date(value)),
          },
        },
        yAxis: {
          {% if not chart.y_scale.diverging %}
          min: 0,
          {% endif %}
          {% if chart.y_scale.diverging %}
          axisLabel: { formatter: (value) => Math.abs(value) },
          {% elif chart.y_scale.percent %}
          splitNumber: 4,
          axisLabel: { formatter: (value) => `${value}%` },
          {% endif %}
          {% if chart.threshold %}
          max: axisMax({{ chart.threshold.value }}),
          {% endif %}
        },
        series: [
          {% for series in chart.series %}
          {
            name: "{{ series.label|capfirst }}",
            type: "bar",
            {% if chart.y_scale.stacked != "false" %}stack: "status",{% endif %}
            showSymbol: false,
            lineStyle: { color: toRgba("{{ series.color }}") },
            itemStyle: { color: toRgba("{{ series.color }}") },
            data: rows.map((row) => row["{{ series.key }}"]),
            {% if series.dataset %}{{ series.dataset|safe }},{% endif %}
            {% if forloop.first %}
              {% if chart.threshold %}
              markLine: {
                silent: true,
                symbol: "none",
                label: {
                  show: true,
                  position: "insideEndTop",
                  formatter: "{{ chart.threshold.label|escapejs }}",
                  color: toRgba("var(--color-muted-foreground)"),
                },
                lineStyle: {
                  color: toRgba("var(--color-chart-gray)"),
                  width: 2,
                  type: "dashed",
                },
                data: [{ yAxis: {{ chart.threshold.value }} }],
              },
              {% elif chart.y_scale.diverging %}
              markLine: {
                silent: true,
                symbol: "none",
                label: { show: false },
                lineStyle: {
                  color: toRgba("var(--color-muted-foreground)"),
                  width: 2,
                  type: "solid",
                },
                data: [{ yAxis: 0 }],
              },
              {% endif %}
            {% endif %}
          }{% if not forloop.last %},{% endif %}
          {% endfor %}
        ],
      });
      {% if chart.y_scale.stacked != "false" %}
      const statusStyles = [
        {% for series in chart.series %}
          { key: "{{ series.key }}", color: toRgba("{{ series.color }}") },
        {% endfor %}
      ];
      /*
       * Link each segment to the next day, after the ECharts variation example.
       * Redrawn on resize, since the bar layout moves with the grid.
       */
      const drawVariation = () => {
        const barData = chart.getModel().getSeriesByIndex(0)?.getData();
        if (!barData) return;
        const pixelY = (day, value) =>
          chart.convertToPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [day, value])[1];
        const elements = [];
        for (let day = 1; day < rows.length; day += 1) {
          const left = barData.getItemLayout(day - 1);
          const right = barData.getItemLayout(day);
          if (!left || !right) return;
          let leftBase = 0;
          let rightBase = 0;
          for (const { key, color } of statusStyles) {
            const leftValue = rows[day - 1][key];
            const rightValue = rows[day][key];
            if (leftValue || rightValue) {
              elements.push({
                type: "polygon",
                silent: true,
                shape: {
                  points: [
                    [left.x + left.width, pixelY(day - 1, leftBase)],
                    [left.x + left.width, pixelY(day - 1, leftBase + leftValue)],
                    [right.x, pixelY(day, rightBase + rightValue)],
                    [right.x, pixelY(day, rightBase)],
                  ],
                },
                style: { fill: color, opacity: 0.25 },
              });
            }
            leftBase += leftValue;
            rightBase += rightValue;
          }
        }
        chart.setOption({ graphic: { elements } }, { replaceMerge: ["graphic"] });
      };
      drawVariation();
      {% endif %}
      window.addEventListener("resize", () => {
        chart.resize();
        {% if chart.y_scale.stacked != "false" %}drawVariation();{% endif %}
      });
    }
  </script>
</section>
