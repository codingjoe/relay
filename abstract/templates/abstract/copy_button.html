{% load abstract %}
{# Not for `.input-group`: buttons there stay inline, where relint's icon-xs rule can see them. #}
<button
  type="button"
  class="btn"
  data-variant="ghost"
  data-size="icon"
  data-copy="{{ value }}"
  aria-label="{{ label }}"
>
  {% tabler name="copy" size="3.5" %}
</button>
