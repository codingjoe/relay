{% load abstract %}
{# Buttons inside an `.input-group` pass size="icon-xs"; the default fits standalone rows. #}
<button
  type="button"
  class="btn"
  data-variant="ghost"
  data-size="{% firstof size 'icon' %}"
  data-copy="{{ value }}"
  {% if tooltip %}data-tooltip="{{ tooltip }}"{% endif %}
  aria-label="{{ label }}"
>
  {% tabler name="copy" size="3.5" %}
</button>
