include:
  - path:
      - compose.production.yml
      - oci://docker.io/codingjoe/the-box:latest
services:
  web:
    build:
      target: development
    command: ["-m", "manage", "runserver", "0.0.0.0:${PORT:-8000}"]
    volumes:
      - .:/app:cached
  dns:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
  smtp:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
  mx:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
  worker:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    command: ["-m", "manage", "threadmill", "worker"]
