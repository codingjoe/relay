x-application-environment: &application-environment
  AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID}
  AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-relay}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-fsn1}
  AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-path}
  RELAY_DNS_SMTP_IPS: ${RELAY_DNS_SMTP_IPS}
  RELAY_SMTP_SOURCE_IPS: ${RELAY_SMTP_SOURCE_IPS}
# Local development builds on the debug distroless flavor, so shells work in `docker compose exec`.
x-development-build: &development-build
  target: development
  args: &development-args
    DISTROLESS_FLAVOR: debug-nonroot

include:
  - path:
      - compose.production.yml

services:
  dns:
    build: *development-build
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    pull_policy: build
  dnsdist:
    ports: !override
      - '127.0.0.1:53:53/udp'
      - '127.0.0.1:53:53/tcp'
  migration:
    build:
      args: *development-args
    pull_policy: build
  msa:
    build: *development-build
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      # The dev box's Caddy issues localhost certificates with its local CA.
      RELAY_SMTP_TLS_CERT_PATH: /data/caddy/certificates/local/smtp.${HOSTNAME:-localhost}/smtp.${HOSTNAME:-localhost}.crt
      RELAY_SMTP_TLS_KEY_PATH: /data/caddy/certificates/local/smtp.${HOSTNAME:-localhost}/smtp.${HOSTNAME:-localhost}.key
    pull_policy: build
  mta:
    build: *development-build
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      # The dev box's Caddy issues localhost certificates with its local CA.
      RELAY_MX_TLS_CERT_PATH: /data/caddy/certificates/local/mail.${HOSTNAME:-localhost}/mail.${HOSTNAME:-localhost}.crt
      RELAY_MX_TLS_KEY_PATH: /data/caddy/certificates/local/mail.${HOSTNAME:-localhost}/mail.${HOSTNAME:-localhost}.key
    pull_policy: build
  sender:
    build: *development-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    command: [ "-m", "manage", "threadmill", "worker", "--queues", "delivery" ]
    pull_policy: build
  web:
    build: *development-build
    volumes:
      - .:/app:cached
    environment:
      <<: *application-environment
    command: [ "-m", "manage", "runserver", "0.0.0.0:${PORT:-8000}" ]
    pull_policy: build
  worker:
    build: *development-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    command: [ "-m", "manage", "threadmill", "worker", "--queues", "ingress", "egress", "default" ]
    pull_policy: build
