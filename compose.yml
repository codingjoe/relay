include:
  - path:
      - compose.production.yml
#      - oci://docker.io/codingjoe/the-box:main
services:
  dns:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
  mx:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
  smtp:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
  web:
    build:
      target: development
    volumes:
      - .:/app:cached
    command: [ "-m", "manage", "runserver", "0.0.0.0:${PORT:-8000}" ]
  worker:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    command: [ "-m", "manage", "threadmill", "worker" ]
