include:
  - path:
      - compose.production.yml
      - oci://docker.io/codingjoe/the-box:latest
services:
  web:
    build:
      target: development
    command: ["-m", "manage", "runserver", "0.0.0.0:${PORT:-8000}"]
    volumes:
      - .:/app:cached
    environment:
      RELAY_ENVIRONMENT: development
  dns:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      RELAY_ENVIRONMENT: development
  dnsdist:
    ports: !override
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:53:53/tcp"
  smtp:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      RELAY_ENVIRONMENT: development
      RELAY_SMTP_ALLOW_INSECURE: true
    ports: !override
      - "127.0.0.1:587:587"
  mx:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      RELAY_ENVIRONMENT: development
  worker:
    build:
      target: development
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      RELAY_ENVIRONMENT: development
    command: ["-m", "manage", "threadmill", "worker"]
