include:
  - path:
      - compose.production.yml
#      - oci://docker.io/codingjoe/the-box:main
services:
  dns:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    pull_policy: build
  dnsdist:
    ports: !override
      - '127.0.0.1:53:53/udp'
      - '127.0.0.1:53:53/tcp'
  migration:
    pull_policy: build
  msa:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    pull_policy: build
  mta:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    pull_policy: build
  web:
    build:
      target: development
    volumes:
      - .:/app:cached
    command: [ "-m", "manage", "runserver", "0.0.0.0:${PORT:-8000}" ]
    pull_policy: build
  worker:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    command: [ "-m", "manage", "threadmill", "worker" ]
    pull_policy: build
