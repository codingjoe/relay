apiVersion: v1
kind: ServiceAccount
metadata:
  name: dozzle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dozzle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dozzle
    spec:
      serviceAccountName: dozzle
      containers:
        - name: dozzle
          image: amir20/dozzle:v11.1.3
          env:
            - {name: DOZZLE_MODE, value: k8s}
            # The ClusterRole in dozzle-rbac.yaml is cluster-scoped, because
            # Dozzle lists nodes at startup and pings the API in the default
            # namespace. This keeps the UI to the namespace that matters.
            - {name: DOZZLE_NAMESPACE, value: relay}
            - {name: DOZZLE_HOSTNAME, value: relay}
          ports:
            - {name: http, containerPort: 8080}
          # /healthcheck asks the same API the UI does, so a pod that cannot
          # read logs reports itself unready instead of serving an empty
          # dashboard.
          readinessProbe:
            httpGet: {path: /healthcheck, port: http}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthcheck, port: http}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 10m}
            limits: {cpu: "1", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dozzle
spec:
  selector:
    app.kubernetes.io/name: dozzle
  ports:
    - {name: http, port: 8080, targetPort: http}
