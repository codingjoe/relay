-- Listen on port 53 (UDP + TCP)
addLocal("0.0.0.0:53")

-- Authoritative nameserver: allow queries from all sources
setACL({"0.0.0.0/0", "::/0"})

-- One backend per 'dns' replica, re-synced every 10 seconds so scaled and
-- redeployed replicas are picked up without a restart. The absolute,
-- reserved name keeps a mid-deploy lookup from falling through to public
-- DNS.
--
-- This was 'dns.relay.internal.' under Docker's embedded DNS. The dns
-- Service is headless, so this resolves to one A record per ready pod,
-- which is what the replica sync below expects.
local replicas = {}
local generation = 0

local function syncReplicas(resolvedAddresses)
    local resolved = {}
    for _, resolvedAddress in ipairs(resolvedAddresses) do
        if resolvedAddress:isIPv4() then
            local address = resolvedAddress:toString()
            resolved[address] = true
            if not replicas[address] then
                replicas[address] = newServer({address=address .. ":5353", name="authoritative"})
            end
        end
    end
    -- Empty result (e.g. mid-deploy): keep the known replicas.
    if next(resolved) == nil then
        return
    end
    for address, server in pairs(replicas) do
        if not resolved[address] then
            rmServer(server)
            replicas[address] = nil
        end
    end
end

local function resolveReplicas()
    generation = generation + 1
    local currentGeneration = generation
    getAddressInfo("dns.relay.svc.cluster.local.", function(_, resolvedAddresses)
        -- Drop stale snapshots.
        if currentGeneration == generation then
            syncReplicas(resolvedAddresses)
        end
    end)
end

resolveReplicas()

-- Re-resolve every 10 maintenance ticks (~10s).
local ticks = 0
function maintenance()
    ticks = ticks + 1
    if ticks % 10 == 0 then
        resolveReplicas()
    end
end

-- Cache responses to reduce upstream load
pc = newPacketCache(10000, {maxTTL=86400, minTTL=0})
getPool(""):setCache(pc)
