apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp
        dev.dozzle.name: mcp
        dev.dozzle.group: web
      annotations:
        dev.dozzle.icon: 'data:image/svg+xml;base64,'
    spec:
      containers:
        - name: mcp
          image: ghcr.io/codingjoe/relay
          # `asgi` sends lifespan events; FastMCP starts its session manager from them.
          args: ["-m", "granian", "--interface", "asgi", "--port", "8000", "--host", "0.0.0.0", "services.mcp.asgi:application"]
          env:
            - name: HOSTNAME
              valueFrom:
                secretKeyRef: {name: relay-infra, key: HOSTNAME}
          envFrom:
            - configMapRef:
                name: relay-config
            - secretRef:
                name: dotenvx-key
            - secretRef:
                name: relay-cluster-env
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe: &healthProbe
            exec:
              command:
                - python
                - -c
                - 'import os, urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/health", headers={"Host": os.environ["HOSTNAME"]}), timeout=5)'
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            !!merge <<: *healthProbe
            periodSeconds: 15
          resources:
            requests: {cpu: 100m}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - {name: http, port: 8000, targetPort: http}
