apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: relay
resources:
  - pvcs.yaml
  - configmap.yaml
  - caddy.yaml
  - dns.yaml
  - web.yaml
  - mail.yaml
  - data.yaml
  - dozzle.yaml
# dozzle-rbac.yaml is cluster-scoped and applied once with the admin
# kubeconfig, because the deploy token's Role cannot create ClusterRoles.
configMapGenerator:
  - name: caddy-config
    files:
      - caddy/Caddyfile
  - name: dnsdist-config
    files:
      - dnsdist/dnsdist.conf
images:
  - name: ghcr.io/codingjoe/relay
    newTag: local
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: relay
