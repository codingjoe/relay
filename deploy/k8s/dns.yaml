apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsdist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dnsdist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnsdist
        dev.dozzle.name: dnsdist
        dev.dozzle.group: dns
        dev.dozzle.icon: powerdns
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: dnsdist
          image: powerdns/dnsdist-21:2.1.2
          securityContext:
            # Root, like caddy and the mail servers. A non-root user cannot use
            # an added capability: the runtime puts it in the bounding set but
            # the process has no permitted set to raise it from, so the bind is
            # denied. Docker never needs this because it sets
            # ip_unprivileged_port_start=0; the node's value is 1024.
            runAsUser: 0
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/dnsdist}
          readinessProbe: &dnsProbe
            exec:
              command:
                - python3
                - -c
                - |
                  import socket, time
                  label = str(int(time.time())).encode()
                  query = bytes.fromhex('123400000001000000000000') + bytes([len(label)]) + label + b'\x06health\x00' + b'\x00\x01\x00\x01'
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  s.settimeout(5)
                  s.sendto(query, ('127.0.0.1', 53))
                  response = s.recv(512)
                  assert response[:2] == query[:2]
                  assert response[3] & 0xF == 0
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            !!merge <<: *dnsProbe
            failureThreshold: 5
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m}
            limits: {cpu: "0.5", memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: dnsdist-config
---
apiVersion: v1
kind: Service
metadata:
  name: dns
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dns
  ports:
    - {name: dns, port: 5353, targetPort: dns}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns
        dev.dozzle.name: dns
        dev.dozzle.group: dns
        dev.dozzle.icon: django
    spec:
      containers:
        - name: dns
          image: ghcr.io/codingjoe/relay
          args: ["-m", "manage", "dns", "--port", "5353"]
          env:
            - name: HOSTNAME
              valueFrom:
                secretKeyRef: {name: relay-infra, key: HOSTNAME}
          envFrom:
            - configMapRef:
                name: relay-config
            - secretRef:
                name: dotenvx-key
            - secretRef:
                name: relay-cluster-env
          ports:
            - {name: dns, containerPort: 5353}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import dns.message, dns.query; dns.query.udp(dns.message.make_query('relay.health', 'A'), '127.0.0.1', port=5353, timeout=5)"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import dns.message, dns.query; dns.query.udp(dns.message.make_query('relay.health', 'A'), '127.0.0.1', port=5353, timeout=5)"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m}
            limits: {cpu: "0.5", memory: 256Mi}
