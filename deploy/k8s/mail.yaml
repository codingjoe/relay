apiVersion: apps/v1
kind: Deployment
metadata:
  name: msa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: msa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msa
        dev.dozzle.icon: django
    spec:
      containers:
        - name: msa
          image: ghcr.io/codingjoe/relay
          args: ["-m", "manage", "msa", "--ports", "587"]
          env:
            - name: HOSTNAME
              valueFrom:
                secretKeyRef: {name: relay-infra, key: HOSTNAME}
          envFrom:
            - configMapRef:
                name: relay-config
            - secretRef:
                name: dotenvx-key
            - secretRef:
                name: relay-cluster-env
          ports:
            - {name: submission, containerPort: 587}
            - {name: balancer, containerPort: 2465}
          securityContext:
            runAsUser: 0
            capabilities:
              # Root for Caddy's root-only certificates, and Kubernetes
              # does not set Docker's ip_unprivileged_port_start=0, so the
              # bind on 587 and 25 needs the capability back.
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - {name: caddy-data, mountPath: /data, readOnly: true}
          startupProbe:
            exec:
              command: ["python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 587), timeout=5); s.sendall(b'PROXY UNKNOWN\\r\\n'); assert s.recv(1024).startswith(b'220'); s.sendall(b'QUIT\\r\\n')"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 587), timeout=5); s.sendall(b'PROXY UNKNOWN\\r\\n'); assert s.recv(1024).startswith(b'220'); s.sendall(b'QUIT\\r\\n')"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 587), timeout=5); s.sendall(b'PROXY UNKNOWN\\r\\n'); assert s.recv(1024).startswith(b'220'); s.sendall(b'QUIT\\r\\n')"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
---
apiVersion: v1
kind: Service
metadata:
  name: msa
spec:
  selector:
    app.kubernetes.io/name: msa
  ports:
    - {name: submission, port: 587, targetPort: submission}
    - {name: balancer, port: 2465, targetPort: balancer}
---
