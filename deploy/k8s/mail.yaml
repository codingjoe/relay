apiVersion: apps/v1
kind: Deployment
metadata:
  name: rspamd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rspamd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rspamd
        dev.dozzle.icon: rspamd
    spec:
      containers:
        - name: rspamd
          image: rspamd/rspamd:4.1
          ports:
            - {name: controller, containerPort: 11334}
          volumeMounts:
            - {name: config, mountPath: /etc/rspamd/local.d, readOnly: true}
          readinessProbe:
            httpGet: {path: /ping, port: controller}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ping, port: controller}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            # 512Mi is killed at startup, while rspamd compiles its hyperscan
            # databases and loads the maps.
            limits: {cpu: "0.5", memory: 2Gi}
      volumes:
        - name: config
          secret:
            secretName: rspamd-config
---
apiVersion: v1
kind: Service
metadata:
  name: rspamd
spec:
  selector:
    app.kubernetes.io/name: rspamd
  ports:
    - {name: controller, port: 11334, targetPort: controller}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        # dashboard-icons slug. Dozzle does not bundle ClamAV's icon yet, so
        # the label renders nothing until it does.
        dev.dozzle.icon: clam-av
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:1.5.4_base-debian13-slim
          env:
            - {name: CLAMAV_NO_FRESHCLAMD, value: "true"}
            - {name: CLAMD_CONF_ConcurrentDatabaseReload, value: "no"}
            - {name: CLAMD_CONF_AlertExceedsMax, value: "yes"}
            - {name: CLAMD_CONF_StreamMaxLength, value: "40M"}
          ports:
            - {name: clamd, containerPort: 3310}
          volumeMounts:
            - {name: signatures, mountPath: /var/lib/clamav}
          startupProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["clamdcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m}
            limits: {memory: 4Gi}
      volumes:
        - name: signatures
          persistentVolumeClaim:
            claimName: clamav
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector:
    app.kubernetes.io/name: clamav
  ports:
    - {name: clamd, port: 3310, targetPort: clamd}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clamav-updater
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav-updater
        dev.dozzle.icon: clam-av
    spec:
      restartPolicy: Never
      containers:
        - name: clamav-updater
          image: clamav/clamav:1.5.4_base-debian13-slim
          resources:
            requests: {cpu: 100m}
            limits: {memory: 1Gi}
          args: ["sh", "-c", "freshclam --foreground --stdout || test -e /var/lib/clamav/main.cvd"]
          env:
            - {name: FRESHCLAM_CONF_TestDatabases, value: "no"}
          volumeMounts:
            - {name: signatures, mountPath: /var/lib/clamav}
      volumes:
        - name: signatures
          persistentVolumeClaim:
            claimName: clamav
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
    spec:
      containers:
        - name: storage
          image: andrewgaul/s3proxy:4.1.1
          env:
            - {name: S3PROXY_ENDPOINT, value: "http://0.0.0.0:8080"}
            - {name: S3PROXY_AUTHORIZATION, value: aws-v4}
            - {name: JCLOUDS_PROVIDER, value: aws-s3}
            - name: S3PROXY_IDENTITY
              valueFrom:
                secretKeyRef: {name: relay-infra, key: AWS_S3_ACCESS_KEY_ID}
            - name: S3PROXY_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: relay-infra, key: AWS_S3_SECRET_ACCESS_KEY}
            - name: JCLOUDS_IDENTITY
              valueFrom:
                secretKeyRef: {name: relay-infra, key: AWS_S3_ACCESS_KEY_ID}
            - name: JCLOUDS_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: relay-infra, key: AWS_S3_SECRET_ACCESS_KEY}
            - name: JCLOUDS_ENDPOINT
              valueFrom:
                secretKeyRef: {name: relay-infra, key: AWS_S3_ENDPOINT_URL}
            - name: JCLOUDS_REGION
              valueFrom:
                secretKeyRef: {name: relay-infra, key: AWS_S3_REGION_NAME}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 50m}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  selector:
    app.kubernetes.io/name: storage
  ports:
    - {name: http, port: 8080, targetPort: http}
