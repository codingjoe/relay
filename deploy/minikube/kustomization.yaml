apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Run the production stack on minikube. See "Local stack on minikube" in
# deploy/README.md.
namespace: relay
resources:
  - ../k8s
images:
  - name: ghcr.io/codingjoe/relay
    newTag: local
configMapGenerator:
  # ACME cannot issue for a minikube address, and the mail services read
  # Caddy's certificate files at startup.
  - name: caddy-config
    behavior: replace
    files:
      - Caddyfile
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: standard
