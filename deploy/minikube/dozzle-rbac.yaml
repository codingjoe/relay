# The first boot of a production server creates the cluster-scoped part, see
# deploy/talos/machine-config.patch.yaml.tmpl. A laptop has no boot to do it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dozzle
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dozzle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dozzle
subjects:
  - kind: ServiceAccount
    name: dozzle
    namespace: relay
---
# Restart deletes a pod and the shell execs in one, so both stay inside the
# namespace instead of reaching every pod in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dozzle
  namespace: relay
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dozzle
  namespace: relay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dozzle
subjects:
  - kind: ServiceAccount
    name: dozzle
    namespace: relay
