name: 📦 CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  container:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allow the job to check out the repository
      packages: write # Allow the job to push the image to the GitHub Container Registry
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long # Tag the image with the immutable git SHA
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production # Mirror the compose build section
          build-args: |
            UV_NO_DEV=0
          push: ${{ github.ref == 'refs/heads/main' }} # Only publish images from the main branch
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  pytest:
    if: contains(github.head_ref, 'dependabot/npm_and_yarn') != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g pnpm
      - run: pnpm ci --frozen-lockfile
      - run: pnpm run build
      - run: uv run python manage.py check
      - run: uv run python manage.py collectstatic --no-input
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run py.test --cov --cov-report=xml --maxfail=5 -n auto "--randomly-seed=${{ github.run_id }}"
      - uses: actions/upload-code-coverage@v1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          fail-on-error: false
          file: coverage.xml
          language: python
          label: python
