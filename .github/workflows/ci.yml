name: 📦 CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  container:
    name: Build and publish image
    # The cluster is x86_64 (ccx33), so the image has to be. The runner and
    # platforms agree deliberately: building on an arm runner produced an arm64
    # image that no node could pull, with "no match for platform in manifest".
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Allow the job to check out the repository
      packages: write # Allow the job to push the image to the GitHub Container Registry
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long # Tag the image with the immutable git SHA
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64 # Pinned so a runner change cannot ship the wrong architecture
          build-args: |
            UV_NO_DEV=0
            SENTRY_RELEASE=sha-${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }} # Only publish images from the main branch
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  pytest:
    if: contains(github.head_ref, 'dependabot/npm_and_yarn') != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g pnpm
      - run: pnpm ci --frozen-lockfile
      - run: pnpm run build
      - run: uv run python manage.py check
      - run: uv run python manage.py collectstatic --no-input --no-esm
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run py.test --cov --cov-report=xml --maxfail=5 -n auto "--randomly-seed=${{ github.run_id }}"
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
  vendored:
    name: Check the vendored add-ons
    # Only a Docker bump can move these tags without touching the manifests.
    if: startsWith(github.head_ref, 'dependabot/docker')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Diff the add-ons against their releases
        run: |
          set -eo pipefail
          while read -r file url; do
            printf '%s\n' "checking $file against $url"
            curl -fsSL "$url" | diff -u "$file" -
          done <<'EOF'
          deploy/cluster/local-path-storage.yaml https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
          deploy/cluster/metrics-server.yaml https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          deploy/cluster/kubelet-serving-cert-approver.yaml https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/v0.12.1/deploy/standalone-install.yaml
          EOF
