name: 📦 CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  container:
    name: Build and publish image
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Allow the job to check out the repository
      packages: write # Allow the job to push the image to the GitHub Container Registry
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long # Tag the image with the immutable git SHA
      - uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production # Mirror the compose build section
          platforms: ${{ matrix.platform }}
          build-args: |
            UV_NO_DEV=0
          # Only publish images from the main branch, otherwise build without pushing
          outputs: ${{ github.ref == 'refs/heads/main' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    name: Merge platform images
    if: github.ref == 'refs/heads/main'
    needs: [container]
    runs-on: ubuntu-latest
    permissions:
      packages: write # Allow the job to push the image to the GitHub Container Registry
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long # Tag the image with the immutable git SHA
      - uses: docker/setup-buildx-action@v4
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.meta.outputs.tags }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.meta.outputs.tags }}
  pytest:
    if: contains(github.head_ref, 'dependabot/npm_and_yarn') != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g pnpm
      - run: pnpm ci --frozen-lockfile
      - run: pnpm run build
      - run: uv run python manage.py check
      - run: uv run python manage.py collectstatic --no-input
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run py.test --cov --cov-report=xml --maxfail=5 -n auto "--randomly-seed=${{ github.run_id }}"
      - uses: actions/upload-code-coverage@v1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          fail-on-error: false
          file: coverage.xml
          language: python
          label: python
