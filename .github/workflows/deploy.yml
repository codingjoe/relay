name: 📦 Deploy Application
on:
  workflow_run:
    workflows: [📦 CI]
    strategy: wait-all
    timeout: 0
    branches: [main]
    types:
      - completed
  workflow_dispatch: # Allow manual trigger
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # The deploy action derives the Compose project from the ref, so a dispatch
    # from any other branch would build a parallel stack instead. Only main
    # deploys; the CI trigger is already limited to it. A manual dispatch is the
    # operator's redeploy path, so only the CI trigger has a conclusion to check.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.HOSTNAME }}
    steps:
      - uses: codingjoe/the-box/actions/deploy@main
        with:
          ssh-host: ${{ vars.SSH_HOSTNAME }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          hostname: ${{ vars.HOSTNAME }}
          dotenv-private-key: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          environment: production
          rollout-services: web worker sender mta msa dns
