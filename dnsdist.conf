-- Listen on port 53 (UDP + TCP)
addLocal("0.0.0.0:53")

-- Resolve the 'dns' service hostname via Docker's embedded DNS
local handle = io.popen("getent hosts dns")
local result = handle:read("*a")
handle:close()
local dns_ip = result:match("(%d+%.%d+%.%d+%.%d+)")

-- Forward to the authoritative DNS server
newServer({address=dns_ip .. ":5353", name="authoritative"})

-- Cache responses to reduce upstream load
pc = newPacketCache(10000, {maxTTL=86400, minTTL=0})
getPool(""):setCache(pc)
