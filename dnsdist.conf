-- Public DNS edge. The Django/dnslib authority is private at dns:5353.
setLocal("0.0.0.0:53", {
  maxConcurrentTCPConnections = 64,
  tcpListenQueueSize = 64,
})
setACL({"0.0.0.0/0"})

setMaxTCPClientThreads(2)
setMaxTCPConnectionsPerClient(8)
setMaxTCPConnectionRatePerClient(20)
setMaxTCPConnectionDuration(10)
setMaxTCPQueriesPerConnection(10)
setMaxTCPQueuedConnections(64)
setMaxTCPReadIOsPerQuery(8)
setTCPConnectionsOverloadThreshold(80)

-- Limit abusive clients before their traffic reaches Django and PostgreSQL.
addAction(MaxQPSIPRule(100, 32, 64, 200), DropAction())

setMaxUDPOutstanding(256)
newServer({
  address = "dns:5353",
  maxConcurrentTCPConnections = 8,
})
