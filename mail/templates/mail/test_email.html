{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "test email"|capfirst %} — {{ m|title }}{% endblock %}
{% block content %}
  <h2>{% translate "send test email"|title %}</h2>
  <form method="post">
    {% csrf_token %}
    <label for="domain">{% translate "domain"|capfirst context "noun" %}</label>
    <select id="domain" name="domain" required>
      <option value="free" data-domain="{{ free_sender_domain }}">
        {{ free_sender_domain }} ({% translate "free" %})
      </option>
      {% for domain in domains %}
        <option value="{{ domain.pk }}" data-domain="{{ domain.name }}">{{ domain.name }}</option>
      {% empty %}
        <option disabled>{% translate "no domains." %}</option>
      {% endfor %}
    </select>

    <label for="from">{% translate "from"|capfirst context "email" %}</label>
    <input type="email" id="from" value="{{ user.username }}@{{ free_sender_domain }}" disabled>

    <label for="rcpt_to">{% translate "to"|capfirst context "email" %}</label>
    <input type="email" id="rcpt_to" name="rcpt_to" value="{{ user.email }}" readonly>

    <label for="subject">{% translate "subject"|capfirst context "email" %}</label>
    <input type="text" id="subject" name="subject">

    <label for="body">{% translate "body"|capfirst context "noun" %}</label>
    <textarea id="body" name="body" rows="10"></textarea>

    <button type="submit">{% translate "send"|capfirst context "verb" %}</button>
  </form>

  <script>
    const domainSelect = document.getElementById('domain');
    const fromInput = document.getElementById('from');
    const updateFrom = () => {
      const domain = domainSelect.selectedOptions[0]?.dataset.domain ?? '—';
      const localPart = domainSelect.value === 'free' ? '{{ user.username|escapejs }}' : 'postmaster';
      fromInput.value = `${localPart}@${domain}`;
    };
    domainSelect.addEventListener('change', updateFrom);
    updateFrom();
  </script>
{% endblock %}
